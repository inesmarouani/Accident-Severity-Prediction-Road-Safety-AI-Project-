[project]
name = "accident-severity-dashboard"
version = "0.1.0"
description = "Dashboard Dash pour la visualisation et prédiction d'accidents"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "dash>=2.18.0",
    "dash-bootstrap-components>=1.6.0",
    "pandas>=2.2.0",
    "plotly>=5.24.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []