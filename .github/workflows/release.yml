name: Semantic Release

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
      - develop

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    concurrency: release-${{ github.ref }}

    steps:
      - name: Generate App Token
        id: get_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.get_token.outputs.token }}

      - name: Checkout branch
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          echo "Checking out branch: $BRANCH_NAME"
          git checkout "$BRANCH_NAME"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: ./back
        run: uv sync --extra dev

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Python Semantic Release
        working-directory: ./back
        id: release
        env:
          GH_TOKEN: ${{ steps.get_token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.get_token.outputs.token }}
        run: |
          uv run semantic-release version --changelog
          if [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "📦 Creating GitHub Release (main)"
            uv run semantic-release publish
          else
            echo "⏭️ Pre-release only (develop)"
            git push --follow-tags origin HEAD
          fi

      - name: Publish to GHCR (if new release)
        if: steps.release.outputs.released == 'true'
        working-directory: ./back
        run: |
          echo "New version released: ${{ steps.release.outputs.version }}"
          echo "Tag created: ${{ steps.release.outputs.tag }}"
