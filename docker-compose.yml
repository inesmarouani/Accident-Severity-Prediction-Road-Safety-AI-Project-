version: "3.8"

services:
  db:
    image: postgres:13
    container_name: accident_severity_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: accidents
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d accidents"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network
  back:
    #build:
      #context: ./back
      #dockerfile: Dockerfile
    container_name: accident_severity_back
    image: inesmarouani/accident-back:latest
    ports:
      - "8000:8000"
    environment:
      DB_USER: user
      DB_PASSWORD: password
      DB_NAME: accidents
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./back/data:/app/data   # dossier partagé entre hôte et conteneur
    networks:
      - app-network

  front:
    #build:
      #context: ./front
      #dockerfile: Dockerfile
    container_name: accident_severity_front
    image: inesmarouani/accident-front:latest
    ports:
      - "8050:8050"
    depends_on:
      - back
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  db_data: