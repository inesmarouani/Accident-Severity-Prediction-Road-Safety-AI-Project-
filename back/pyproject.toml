[project]
name = "back"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.128.2",
    "joblib>=1.5.3",
    "lightgbm>=4.6.0",
    "pandas>=3.0.0",
    "psycopg2-binary>=2.9.11",
    "scikit-learn>=1.8.0",
    "sqlmodel>=0.0.32",
    "uvicorn>=0.40.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.6.0",

]

[project.optional-dependencies]
dev = [
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "bandit>=1.7.0",
    "safety>=2.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # On commence en mode permissif
check_untyped_defs = true
ignore_missing_imports = true  # Pour les bibliothèques sans stubs

exclude = [
    "tests/",
    ".venv/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "--strict-markers --cov=app --cov-report=term-missing"

[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pandas-stubs>=3.0.0.260204",
    "types-passlib>=1.7.7.20260211",
]

